<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora API</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="calculadora">
        <h1>Calculadora</h1>
        <div class="endpoint">
            <code>api/calculadora/</code>
        </div>

        <div class="campos">
            <input type="number" id="numA" placeholder="Número A">
            <input type="number" id="numB" placeholder="Número B">
        </div>

        <div class="botones">
            <button onclick="calcular('sumar')">+ Sumar</button>
            <button onclick="calcular('restar')">− Restar</button>
            <button onclick="calcular('multiplicar')">× Multiplicar</button>
            <button onclick="calcular('dividir')">÷ Dividir</button>
        </div>

        <div id="resultado" class="resultado">
            Resultado
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
